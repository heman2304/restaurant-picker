<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Restaurant Picker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#1a1a2e; color:#eee; min-height:100vh; }
  .screen { min-height:100vh; display:flex; flex-direction:column; padding:20px; }
  #mainScreen { justify-content:center; align-items:center; }
  h1 { font-size:1.6rem; color:#ffd166; margin-bottom:30px; text-align:center; }
  #btnSpin { width:220px; padding:22px; font-size:1.5rem; font-weight:800; border:none; border-radius:16px; background:linear-gradient(135deg,#ffd166,#ffb703); color:#111; cursor:pointer; }
  #btnSpin:active { transform:scale(.97); }
  #catSelect { margin-top:20px; padding:12px 16px; font-size:1rem; border-radius:10px; border:1px solid #444; background:#16213e; color:#eee; width:220px; text-align:center; }
  #btnSettings { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:12px 32px; border:none; border-radius:12px; background:#16213e; color:#aaa; font-size:.95rem; cursor:pointer; border:1px solid #333; }
  #resultScreen { display:none; justify-content:center; align-items:center; text-align:center; }
  #closeX { position:fixed; top:16px; right:16px; width:40px; height:40px; border:none; border-radius:50%; background:#16213e; color:#eee; font-size:1.4rem; cursor:pointer; }
  #resultName { font-size:2rem; font-weight:800; color:#ffd166; margin-bottom:8px; }
  #resultMeta { color:#aaa; font-size:.9rem; margin-bottom:24px; }
  .resultLinks { display:flex; gap:12px; justify-content:center; margin-bottom:30px; }
  .resultLinks a { padding:14px 28px; border-radius:12px; text-decoration:none; font-weight:700; font-size:1rem; }
  .btnMenu { background:#4cc9f0; color:#111; }
  .btnCall { background:#06d6a0; color:#111; }
  #btnSpinAgain { padding:14px 32px; border:none; border-radius:12px; background:#e63946; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
  #settingsScreen { display:none; padding:20px; }
  #settingsScreen h2 { color:#ffd166; margin-bottom:16px; }
  #btnBack { background:none; border:none; color:#4cc9f0; font-size:1rem; margin-bottom:16px; cursor:pointer; }
  #btnAddNew { width:100%; padding:14px; border:none; border-radius:12px; background:#06d6a0; color:#111; font-size:1rem; font-weight:700; margin-bottom:16px; cursor:pointer; }
  .item { display:flex; align-items:center; justify-content:space-between; padding:12px; background:#16213e; border-radius:10px; margin-bottom:8px; }
  .item .info { flex:1; }
  .item .cat { color:#ffd166; font-size:.75rem; }
  .item .x { background:none; border:none; color:#e63946; font-size:1.3rem; cursor:pointer; padding:4px 8px; }
  #formScreen { display:none; padding:20px; }
  #formScreen h2 { color:#ffd166; margin-bottom:20px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:.85rem; color:#aaa; margin-bottom:6px; }
  .field input, .field select { width:100%; padding:12px; border-radius:10px; border:1px solid #444; background:#16213e; color:#eee; font-size:1rem; }
  .formBtns { display:flex; gap:10px; margin-top:24px; }
  .formBtns button { flex:1; padding:14px; border:none; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer; }
  #btnSave { background:#06d6a0; color:#111; }
  #btnCancel { background:#444; color:#eee; }
  #animOverlay { display:none; position:fixed; inset:0; background:#1a1a2e; z-index:100; align-items:center; justify-content:center; flex-direction:column; }
  .animChar { font-size:5rem; animation:hungerThenIdea 3s ease-in-out forwards; }
  @keyframes hungerThenIdea {
    0% { transform:scale(1) rotate(-4deg); opacity:1; }
    15% { transform:scale(1.05) rotate(4deg); }
    30% { transform:scale(1) rotate(-4deg); }
    45% { transform:scale(1.05) rotate(4deg); }
    60% { transform:scale(1.08) rotate(0); opacity:1; }
    80% { transform:scale(1.1) rotate(0); opacity:0.6; }
    100% { transform:scale(1.15) rotate(0); opacity:0; }
  }
  .finger { position:absolute; font-size:2.8rem; top:28%; right:32%; animation:pointUp 1.2s ease-out 1.8s forwards; opacity:0; }
  @keyframes pointUp {
    0% { opacity:0; transform:translateY(10px) rotate(-10deg); }
    30% { opacity:1; transform:translateY(0) rotate(0); }
    70% { opacity:1; transform:translateY(-5px) rotate(15deg); }
    100% { opacity:0; transform:translateY(-25px) rotate(20deg); }
  }
</style>
</head>
<body>

<div class="screen" id="mainScreen">
  <h1>Restaurant Picker</h1>
  <button id="btnSpin">Spin It</button>
  <select id="catSelect"></select>
  <button id="btnSettings">Settings</button>
</div>

<div class="screen" id="resultScreen">
  <button id="closeX">×</button>
  <div id="resultName"></div>
  <div id="resultMeta"></div>
  <div class="resultLinks">
    <a class="btnMenu" id="linkMenu" href="#" target="_blank">Menu</a>
    <a class="btnCall" id="linkCall" href="#">Call</a>
  </div>
  <button id="btnSpinAgain">Spin Again</button>
</div>

<div class="screen" id="settingsScreen">
  <button id="btnBack">← Back</button>
  <h2>Settings</h2>
  <button id="btnAddNew">+ Add Restaurant</button>
  <div id="list"></div>
</div>

<div class="screen" id="formScreen">
  <h2>Add Restaurant</h2>
  <div class="field"><label>Name</label><input id="fName" placeholder="Restaurant name"></div>
  <div class="field"><label>Category</label>
    <select id="fCat">
      <option>Fast Food</option><option>American</option><option>Mexican</option>
      <option>Deli Sandwiches</option><option>Pizza</option><option>Ethnic</option><option>Other</option>
    </select>
  </div>
  <div class="field"><label>Phone Number</label><input id="fPhone" placeholder="(309) 555-1234"></div>
  <div class="field"><label>Menu / Website URL</label><input id="fUrl" placeholder="https://..."></div>
  <div class="formBtns">
    <button id="btnSave">Save</button>
    <button id="btnCancel">Cancel</button>
  </div>
</div>

<div id="animOverlay">
  <div class="animChar">😋</div>
  <div class="finger">👆</div>
</div>

<script>
const restaurants = [
  {name:"Wendy's",cat:"Fast Food",phone:"(309) 752-9400",url:"https://www.wendys.com/en/menu"},
  {name:"Taco John's",cat:"Fast Food",phone:"(309) 793-2200",url:"https://www.tacojohns.com/menu"},
  {name:"Chick-fil-A",cat:"Fast Food",phone:"(309) 752-0100",url:"https://www.chick-fil-a.com/menu"},
  {name:"Hardee's",cat:"Fast Food",phone:"(309) 793-3300",url:"https://www.hardees.com/menu"},
  {name:"Finn's",cat:"American",phone:"(309) 752-3466",url:"https://www.finnsrestaurant.com/menu"},
  {name:"Luli's",cat:"American",phone:"(309) 793-8585",url:"https://www.lulis.com/menu"},
  {name:"Sports Bar",cat:"American",phone:"",url:""},
  {name:"Pancheros",cat:"Mexican",phone:"(309) 752-7272",url:"https://www.pancheros.com/menu"},
  {name:"Old Mexico",cat:"Mexican",phone:"(309) 793-0101",url:"https://www.oldmexicoqc.com/menu"},
  {name:"Rudy's Tacos",cat:"Mexican",phone:"",url:""},
  {name:"McAlister's",cat:"Deli Sandwiches",phone:"(309) 752-6200",url:"https://www.mcalistersdeli.com/menu"},
  {name:"Jersey Mike's",cat:"Deli Sandwiches",phone:"(309) 752-5353",url:"https://www.jerseymikes.com/menu"},
  {name:"Arthur's",cat:"Deli Sandwiches",phone:"",url:""},
  {name:"Hungry Hobo",cat:"Deli Sandwiches",phone:"",url:"https://www.hungryhobo.com/locations"},
  {name:"Jimmy John's",cat:"Deli Sandwiches",phone:"(309) 752-5466",url:"https://www.jimmyjohns.com/menu"},
  {name:"Pagallo's",cat:"Pizza",phone:"(309) 793-7272",url:"https://www.pagallos.com/menu"},
  {name:"Casey's",cat:"Pizza",phone:"(309) 752-2273",url:"https://www.caseys.com/menu"},
  {name:"Happy Joe's",cat:"Pizza",phone:"(309) 793-4277",url:"https://www.happyjoes.com/menu"},
  {name:"Tony's",cat:"Pizza",phone:"",url:""},
  {name:"Alfano's Pizza and Subs",cat:"Pizza",phone:"",url:""},
  {name:"Benny's Pizza",cat:"Pizza",phone:"",url:""},
  {name:"Shanghai",cat:"Ethnic",phone:"",url:"https://www.shanghaiqc.com/menu"},
  {name:"Thai Flavors",cat:"Ethnic",phone:"",url:"https://www.facebook.com/thaiflavorsqc/menu"},
  {name:"Olive Garden",cat:"Ethnic",phone:"(309) 752-6588",url:"https://www.olivegarden.com/menu"},
  {name:"Uncle Pete's",cat:"Ethnic",phone:"",url:""},
  {name:"Pee-wee's",cat:"American",phone:"",url:""},
  {name:"Applebee's",cat:"American",phone:"(309) 752-2700",url:"https://www.applebees.com/menu"},
  {name:"Rock Island Ale House",cat:"American",phone:"(309) 788-2337",url:"https://www.rockislandalehouse.com"},
  {name:"Al's Burgers",cat:"American",phone:"",url:"https://www.alsburgers.com/menu"}
];

const mainScreen = document.getElementById('mainScreen');
const resultScreen = document.getElementById('resultScreen');
const settingsScreen = document.getElementById('settingsScreen');
const formScreen = document.getElementById('formScreen');
const animOverlay = document.getElementById('animOverlay');
const catSelect = document.getElementById('catSelect');
const listEl = document.getElementById('list');

function show(screen) {
  [mainScreen, resultScreen, settingsScreen, formScreen].forEach(s => s.style.display = 'none');
  screen.style.display = 'flex';
}
function cats() { return ["All", ...new Set(restaurants.map(r => r.cat))]; }
function fillCats() {
  catSelect.innerHTML = cats().map(c => `<option>${c}</option>`).join('');
}
function renderList() {
  listEl.innerHTML = '';
  restaurants.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<div class="info"><div class="cat">${r.cat}</div>${r.name}</div><button class="x" data-i="${i}">×</button>`;
    listEl.appendChild(d);
  });
  listEl.querySelectorAll('.x').forEach(b => b.onclick = e => {
    restaurants.splice(+e.target.dataset.i, 1);
    renderList();
    fillCats();
  });
}
function doSpin() {
  const cat = catSelect.value;
  const arr = cat === "All" ? restaurants : restaurants.filter(r => r.cat === cat);
  if (!arr.length) { alert('No restaurants in this category'); return; }
  animOverlay.style.display = 'flex';
  setTimeout(() => {
    animOverlay.style.display = 'none';
    const r = arr[Math.floor(Math.random() * arr.length)];
    document.getElementById('resultName').textContent = r.name;
    document.getElementById('resultMeta').textContent = r.cat;
    const menu = document.getElementById('linkMenu');
    const call = document.getElementById('linkCall');
    if (r.url) { menu.href = r.url; menu.style.display = 'inline-block'; } else { menu.style.display = 'none'; }
    if (r.phone) { call.href = 'tel:' + r.phone.replace(/\D/g, ''); call.style.display = 'inline-block'; } else { call.style.display = 'none'; }
    show(resultScreen);
  }, 3000);
}

document.getElementById('btnSpin').onclick = doSpin;
document.getElementById('btnSpinAgain').onclick = doSpin;
document.getElementById('closeX').onclick = () => show(mainScreen);
document.getElementById('btnSettings').onclick = () => { renderList(); show(settingsScreen); };
document.getElementById('btnBack').onclick = () => show(mainScreen);
document.getElementById('btnAddNew').onclick = () => show(formScreen);
document.getElementById('btnCancel').onclick = () => show(settingsScreen);
document.getElementById('btnSave').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Name required'); return; }
  restaurants.push({
    name,
    cat: document.getElementById('fCat').value,
    phone: document.getElementById('fPhone').value.trim(),
    url: document.getElementById('fUrl').value.trim()
  });
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fUrl').value = '';
  fillCats();
  show(settingsScreen);
  renderList();
};

fillCats();
show(mainScreen);
</script>
</body>
</html>
